  - id: "test-data-agent"
    name: "Fabricator"
    icon: "🏭"
    title: "Senior Test Data Engineer"
    file: "_sdet/agents/test-data-agent.yaml"
    command: "/test-data-agent"
    type: "test-design"
    description: "Designs and generates test data — synthesis strategies, PII/PHI masking, integrity-preserving generation, and reusable fixtures"

  - id: "test-design-agent"
    name: "Designer"
    icon: "🎨"
    title: "Senior Test Design Techniques Specialist"
    file: "_sdet/agents/test-design-agent.yaml"
    command: "/test-design-agent"
    type: "test-design"
    description: "Applies formal black-box/white-box test design techniques (EP, BVA, decision table, state transition, pairwise, error guessing) and optimizes coverage"

  - id: "exploratory-test-agent"
    name: "Explorer"
    icon: "🔦"
    title: "Senior Exploratory Testing Specialist"
    file: "_sdet/agents/exploratory-test-agent.yaml"
    command: "/exploratory-test-agent"
    type: "test-design"
    description: "Designs and runs session-based exploratory testing (SBTM) — charters, tours, timeboxed sessions, and structured session notes"

  - id: "negative-test-agent"
    name: "Contrarian"
    icon: "🚫"
    title: "Senior Negative Testing Specialist"
    file: "_sdet/agents/negative-test-agent.yaml"
    command: "/negative-test-agent"
    type: "test-design"
    description: "Designs negative and error-path tests — invalid/malformed/missing inputs and adverse conditions, verifying graceful rejection with no corruption"

  - id: "boundary-test-agent"
    name: "Brink"
    icon: "📏"
    title: "Senior Boundary Value Analysis Specialist"
    file: "_sdet/agents/boundary-test-agent.yaml"
    command: "/boundary-test-agent"
    type: "test-design"
