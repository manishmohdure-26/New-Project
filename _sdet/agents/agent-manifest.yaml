  - id: "decision-table-agent"
    name: "Tabulator"
    icon: "🗃️"
    title: "Senior Decision Table Testing Specialist"
    file: "_sdet/agents/decision-table-agent.yaml"
    command: "/decision-table-agent"
    type: "test-design"
    description: "Applies decision table testing — condition/action tables, don't-care collapsing, and one test per rule for combinational business logic"

  - id: "state-transition-agent"
    name: "Switcher"
    icon: "🔀"
    title: "Senior State Transition Testing Specialist"
    file: "_sdet/agents/state-transition-agent.yaml"
    command: "/state-transition-agent"
