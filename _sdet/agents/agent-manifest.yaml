  - id: "equivalence-agent"
    name: "Partitioner"
    icon: "🧩"
    title: "Senior Equivalence Partitioning Specialist"
    file: "_sdet/agents/equivalence-agent.yaml"
    command: "/equivalence-agent"
    type: "test-design"
