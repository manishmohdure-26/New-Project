    description: "Defines the org/project-level test strategy — test levels, automation pyramid, criteria, tooling, and metrics (the standing policy that test plans instantiate)"

  - id: "test-estimation-agent"
    name: "Estimator"
    icon: "🧮"
    title: "Senior Test Estimation Specialist"
    file: "_sdet/agents/test-estimation-agent.yaml"
    command: "/test-estimation-agent"
    type: "test-design"
    description: "Estimates testing effort/schedule using WBS, PERT 3-point, Test Point Analysis, and %-of-dev, with assumptions, ranges, and buffer"

  - id: "environment-agent"
    name: "Provisioner"
    icon: "🖥️"
    title: "Senior Test Environment Engineer"
    file: "_sdet/agents/environment-agent.yaml"
    command: "/environment-agent"
    type: "test-design"
