# SDET Agent Manifest
# Central registry of all agents in the system

manifest:
  version: "4.0.0"
  module: "sdet"
  total_agents: 75

agents:
  # === DISCOVERY AGENTS ===
  - id: "mom-agent"
    name: "Recorder"
    icon: "📝"
    title: "Senior Business Analyst"
    file: "_sdet/agents/mom-agent.yaml"
    command: "/mom-agent"
    type: "requirements-engineering"
    description: "Generates Minutes of Meeting from transcripts and project documents"

  - id: "user-stories-agent"
    name: "Narrator"
    icon: "📖"
    title: "Senior BA & Product Owner"
    file: "_sdet/agents/user-stories-agent.yaml"
    command: "/user-stories-agent"
    type: "requirements-engineering"
    description: "Extracts user stories and epics from project documents"

  - id: "srs-agent"
    name: "Specifier"
    icon: "📐"
    title: "Senior Requirements Engineer"
    file: "_sdet/agents/srs-agent.yaml"
    command: "/srs-agent"
    type: "requirements-engineering"
    description: "Generates IEEE 830 SRS documents from project materials"

  - id: "knowledge-search-agent"
    name: "Finder"
    icon: "🔍"
    title: "Project Knowledge Search Specialist"
    file: "_sdet/agents/knowledge-search-agent.yaml"
    command: "/knowledge-search-agent"
    type: "requirements-engineering"
    description: "Searches MOMs, transcripts, and project docs to answer questions with date references"

  - id: "acceptance-criteria-agent"
    name: "Definer"
    icon: "\u2705"
    title: "Senior Business Analyst & AC Specialist"
    file: "_sdet/agents/acceptance-criteria-agent.yaml"
    command: "/acceptance-criteria-agent"
    type: "requirements-engineering"
    description: "Writes acceptance criteria for user stories and creates them in Jira epics"

  # === ANALYSIS AGENT ===
  - id: "repo-analysis-agent"
    name: "Scanner"
    icon: "🔬"
    title: "Senior Software Architect & Code Analyst"
    file: "_sdet/agents/repo-analysis-agent.yaml"
    command: "/repo-analysis-agent"
    type: "requirements-engineering"
    description: "Analyzes frontend and backend source code architecture, components, and testability"

  # === DESIGN AGENTS ===
  - id: "test-scenario-agent"
    name: "Strategist"
    icon: "♟️"
    title: "Senior Test Design Strategist"
    file: "_sdet/agents/test-scenario-agent.yaml"
    command: "/test-scenario-agent"
    type: "test-design"
    description: "Creates high-level test scenarios with risk-based prioritization and traceability"

  - id: "test-case-agent"
    name: "Scriptor"
    icon: "📋"
    title: "Senior QA Engineer"
    file: "_sdet/agents/test-case-agent.yaml"
    command: "/test-case-agent"
    type: "test-design"
    description: "Generates comprehensive manual test cases with edge case coverage"

  # === EXECUTION AGENTS ===
  - id: "automation-agent"
    name: "Automator"
    icon: "🤖"
    title: "Senior QA Automation Engineer"
    file: "_sdet/agents/automation-agent.yaml"
    command: "/automation-agent"
    type: "test-automation"
    description: "Writes Playwright E2E tests using POM across 6 modes (Exploratory, Direct-from-source, Workflow chains, Record+Smart-Fill, Chrome Live/Observe, Record-First codegen) with MUI/Keycloak mastery + data verification"

  - id: "api-test-agent"
    name: "Requester"
    icon: "🔌"
    title: "Senior API Test Engineer"
    file: "_sdet/agents/api-test-agent.yaml"
    command: "/api-test-agent"
    type: "test-automation"
    description: "Writes Playwright API tests from Swagger, Postman, source code, or manual specs"

  - id: "workflow-agent"
    name: "Pathfinder"
    icon: "\U0001F9ED"
    title: "Senior QA Workflow Analyst & Behavioral Health E2E Journey Specialist"
    file: "_sdet/agents/workflow-agent.yaml"
    command: "/workflow-agent"
    type: "test-design"
    description: "Two-phase role-based E2E workflows: Phase 1 generates role-wise workflow docs (multi-sheet XLSX + markdown with Priority/Automatable/Route-API + Coverage Matrix); Phase 2 (after approval) builds API precondition fixtures, page objects, and serial Playwright specs"

  - id: "performance-test-agent"
    name: "Benchmark"
    icon: "⚡"
    title: "Senior Performance Test Engineer"
    file: "_sdet/agents/performance-test-agent.yaml"
    command: "/performance-test-agent"
    type: "test-automation"
    description: "Records a workflow via Playwright, converts HAR to a correlated JMeter test plan, runs load/stress tests, and produces an HTML dashboard + verdict report"

  # === REPORTING AGENT ===
  - id: "bug-report-agent"
    name: "Catcher"
    icon: "🐛"
    title: "Senior QA Bug Hunter"
    file: "_sdet/agents/bug-report-agent.yaml"
    command: "/bug-report-agent"
    type: "reporting-documentation"
    description: "Creates structured, actionable bug reports with root cause analysis"

  - id: "simple-bug-report-agent"
    name: "Spotter"
    icon: "\U0001F4A2"
    title: "Quick Bug Report Writer"
    file: "_sdet/agents/simple-bug-report-agent.yaml"
    command: "/simple-bug-report-agent"
    type: "reporting-documentation"
    description: "Quick, no-ceremony bug reports — no evidence, no user story linking, just the bug"

  # === VERIFICATION AGENT ===
  - id: "retest-agent"
    name: "Gatekeeper"
    icon: "🦅"
    title: "Automation Engineer & Release Gatekeeper"
    file: "_sdet/agents/retest-agent.yaml"
    command: "/retest-agent"
    type: "quality-compliance"
    description: "Validates bug fixes via Jira, deployment checks, and browser retesting"

  - id: "spec-conformance-agent"
    name: "Inspector"
    icon: "🔎"
    title: "Spec-Conformance Auditor"
    file: "_sdet/agents/spec-conformance-agent.yaml"
    command: "/spec-conformance-agent"
    type: "quality-compliance"
    description: "Audits a screen/module against curated-wiki requirements via a live walk; produces a client-style HTML conformance dashboard (PASS/FAIL/PARTIAL/NOT-REACHABLE with severity, defect class, verbatim spec quotes, and screenshots)"

  - id: "compliance-agent"
    name: "Sentinel"
    icon: "\U0001F6E1️"
    title: "Senior Healthcare Compliance Auditor"
    file: "_sdet/agents/compliance-agent.yaml"
    command: "/compliance-agent"
    type: "quality-compliance"
    description: "Audits applications for HIPAA / BAA / SOC 2 / CCPA / California / FHIR / OWASP API / IaC compliance; produces consolidated compliance report"

  # === METRICS AGENT ===
  - id: "jira-bug-tracker-agent"
    name: "Tracker"
    icon: "📊"
    title: "Senior QA Metrics Analyst"
    file: "_sdet/agents/jira-bug-tracker-agent.yaml"
    command: "/jira-bug-tracker-agent"
    type: "reporting-documentation"
    description: "Fetches bug data from Jira and generates dashboard reports with status/priority metrics"

  # === DOCUMENTATION AGENT ===
  - id: "release-note-agent"
    name: "Releaser"
    icon: "📦"
    title: "Senior Release Documentation Specialist"
    file: "_sdet/agents/release-note-agent.yaml"
    command: "/release-note-agent"
    type: "reporting-documentation"
    description: "Generates milestone-based release notes as Markdown + Word (.docx) from project context and Jira bug data"

  # === TEST DESIGN AGENTS (v4.0) ===
  - id: "test-plan-agent"
    name: "Charter"
    icon: "\U0001F5C2"
    title: "Senior Test Lead & Test Planning Specialist"
    file: "_sdet/agents/test-plan-agent.yaml"
    command: "/test-plan-agent"
    type: "test-design"
    description: "Authors IEEE 829-style test plans with scope, entry/exit criteria, resource & schedule planning, and risk & contingency"

  - id: "test-strategy-agent"
    name: "Tactician"
    icon: "🧠"
    title: "Senior Test Strategy Architect"
    file: "_sdet/agents/test-strategy-agent.yaml"
    command: "/test-strategy-agent"
