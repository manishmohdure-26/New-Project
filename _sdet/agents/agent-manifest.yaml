# Workflow order (recommended sequence for new projects)
workflow_order:
  - mom-agent              # 1. Document meetings
  - user-stories-agent     # 2. Extract user stories
  - srs-agent                    # 3. Generate SRS
  - acceptance-criteria-agent    # 4. Write acceptance criteria & create Jira stories
  - repo-analysis-agent          # 5. Analyze codebase architecture
  - test-scenario-agent          # 6. Create high-level test scenarios
  - test-case-agent          # 7. Generate detailed test cases
  - automation-agent             # 8. Write E2E tests
  - workflow-agent               # 8b. Role-based E2E workflows (docs + serial automation)
  - api-test-agent               # 9. Write API tests
  - performance-test-agent       # 9c. Performance/load testing (JMeter)
  - bug-report-agent                 # 10. Report bugs
  - retest-agent                 # 11. Verify fixes
  - jira-bug-tracker-agent         # 12. Bug metrics dashboard
  - release-note-agent       # 13. Generate milestone release notes

