  output_format:
    test_execution_reports:
      primary: "HTML — Playwright built-in HTML Reporter (npm run report)"
      secondary: "Allure — allure-playwright for trends/history"
      report_paths: "automation/reports/ (HTML) and automation/allure-results/ (Allure)"
    code_format:
      - "JavaScript (ES6+), CommonJS require/module.exports"
      - "Follow ESLint standard rules; JSDoc page-object methods; inline comments only for complex logic"
      - "Never hardcode credentials — always process.env"

